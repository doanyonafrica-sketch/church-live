<!doctype html><meta charset="utf-8"><title>TPR Live - OBS</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:contain}
#msg{position:fixed;left:0;right:0;bottom:0;font:600 18px/1.4 system-ui,sans-serif;color:#fff;background:rgba(200,60,50,.9);padding:10px 16px;display:none}
#dbg{position:fixed;left:8px;top:8px;font:14px/1.4 monospace;color:#0f0;background:rgba(0,0,0,.65);padding:6px 10px;white-space:pre;display:none}</style>
<video id="v" autoplay playsinline></video><div id="dbg"></div><div id="msg"></div>
<script>
const P=new URLSearchParams(location.search),room=P.get('room')||'main';
/* Tampon anti-saccades (ms). 0 = latence minimale mais l'image saccade au moindre aléa du Wi-Fi.
   180 ms par défaut (le Wi-Fi a de la gigue : 100 ms était trop juste). Modifiable : obs.html?delay=100 (plus réactif) ou ?delay=300 (plus fluide).
   ?code=123456 : seulement si cette page tourne sur un autre appareil que le PC (le PC lui-même n'a pas besoin de code). */
const DELAY=Math.max(0,+(P.get('delay')||180)),CODE=P.get('code')||'';
const MYID=Math.random().toString(36).slice(2)+Date.now().toString(36);   /* identifie cette page : un rechargement n'est pas un « autre appareil » */
const note=t=>{msg.textContent=t;msg.style.display=t?'block':'none'};
let ws,pc,q=Promise.resolve(),prev;
const sj=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
const isLive=()=>!!pc&&pc.connectionState==='connected';
/* « À l'antenne » = la source est visible dans le PROGRAMME d'OBS (pas seulement dans l'aperçu) et l'image est reçue.
   OBS prévient la page par obsSourceActiveChanged. Tant qu'OBS n'a rien dit, on suppose « active » : mieux vaut
   afficher « à l'antenne » à tort que cacher à quelqu'un qu'il est diffusé. */
let srcActive=true;
const isOnAir=()=>isLive()&&srcActive;
const air=()=>sj({type:'onair',value:isOnAir()});
const act=()=>{sj({type:'active',value:isLive()});air()};
window.addEventListener('obsSourceActiveChanged',e=>{srcActive=!!(e.detail&&e.detail.active);air()});
try{if(window.obsstudio)window.obsstudio.onActiveChange=a=>{srcActive=!!a;air()}}catch{}
async function handle(m){
  if(m.type==='offer'){
    if(pc)pc.close();
    pc=new RTCPeerConnection({iceServers:[]});
    pc.onconnectionstatechange=act;
    pc.ontrack=e=>{try{e.receiver.jitterBufferTarget=DELAY}catch{}try{e.receiver.playoutDelayHint=DELAY/1000}catch{}if(v.srcObject!==e.streams[0])v.srcObject=e.streams[0]};
    pc.onicecandidate=e=>e.candidate&&sj({type:'candidate',candidate:e.candidate});
    await pc.setRemoteDescription({type:'offer',sdp:m.sdp});
    const a=await pc.createAnswer();await pc.setLocalDescription(a);sj({type:'answer',sdp:a.sdp});
  }else if(m.type==='candidate'&&pc){pc.addIceCandidate(m.candidate).catch(()=>{});}
  else if(m.type==='publisher-left'){if(pc)pc.close();pc=null;v.srcObject=null;act();}
}
function connect(){
  const w=ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  w.onopen=()=>{note('');sj({type:'join',role:'viewer',room,active:isLive(),onair:isOnAir(),id:MYID,code:CODE})};
  w.onclose=e=>{
    if(w!==ws)return;                       /* ancienne connexion : la nouvelle est déjà en place */
    if(e.code===4000)return;                /* remplacée par cette même page : ne pas se reconnecter */
    if(e.code===4001){note('TPR Live : cette caméra est déjà reçue par une autre source OBS ou un autre onglet. Fermez l\'autre.');return setTimeout(connect,3000)}   /* le nouveau venu attend, il ne chasse personne */
    if(e.code===4003){note('TPR Live : code d\'appairage manquant ou incorrect (adresse ?code=… dans la fenêtre TPR Live).');return setTimeout(connect,10000)}
    setTimeout(connect,1000)};
  w.onmessage=e=>{q=q.then(()=>handle(JSON.parse(e.data))).catch(console.error)};
}
connect();
/* Mesures de réception : toujours envoyées au PC (fenêtre TPR Live) ; affichées dans OBS seulement avec ?debug=1 */
if(P.get('debug'))dbg.style.display='block';
setInterval(async()=>{
  if(!pc||pc.connectionState!=='connected')return;let i;(await pc.getStats()).forEach(x=>{if(x.type==='inbound-rtp'&&x.kind==='video')i=x});
  if(!i){if(P.get('debug'))dbg.textContent='Aucune vidéo reçue';return}
  const dropped=prev?i.framesDropped-prev.framesDropped:0,lost=prev?i.packetsLost-prev.packetsLost:0,
  jb=i.jitterBufferEmittedCount?Math.round(i.jitterBufferDelay/i.jitterBufferEmittedCount*1000):0,jit=Math.round((i.jitter||0)*1000),fps=Math.round(i.framesPerSecond||0);
  sj({type:'vstats',res:(i.frameWidth||0)+'×'+(i.frameHeight||0),fps,dropped,lost,jitter:jit,buf:jb});
  if(P.get('debug'))dbg.textContent='Reçu : '+i.frameWidth+'x'+i.frameHeight+' à '+fps+' i/s\nImages perdues par OBS : '+dropped+' /s\nPaquets perdus : '+i.packetsLost+'\nTampon : '+jb+' ms   Gigue : '+jit+' ms';
  prev=i},1000);
</script>
