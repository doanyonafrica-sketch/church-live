<!doctype html><meta charset="utf-8"><title>TPR Live - OBS</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"><link rel="apple-touch-icon" href="/favicon-180.png">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#v{width:100%;height:100%;object-fit:contain}
#msg{position:fixed;left:0;right:0;bottom:0;z-index:9;font:600 18px/1.4 system-ui,sans-serif;color:#fff;background:rgba(200,60,50,.9);padding:10px 16px;display:none}
#dbg{position:fixed;left:8px;top:8px;z-index:9;font:14px/1.4 monospace;color:#0f0;background:rgba(0,0,0,.65);padding:6px 10px;white-space:pre;display:none}
/* Écran d'attente : visible tant qu'aucune image n'arrive (caméra absente, en connexion, ou image figée) */
#w{position:fixed;inset:0;z-index:5;background:linear-gradient(#103a3f 0%,#0e4145 10%,#11494b 20%,#104e4e 30%,#145355 40%,#185c5c 50%,#216b69 60%,#297774 70%,#348782 80%,#3f958f 90%,#48a29b 100%);transition:opacity .35s}
#w.hide{opacity:0;pointer-events:none}
#w video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.wt{position:absolute;left:0;right:0;bottom:0;padding:5vh 5vw 4.5vh;display:flex;flex-direction:column;align-items:center;gap:.8vh;text-align:center;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#fff;
  background:linear-gradient(transparent,rgba(4,28,30,.78))}
.wt h1{font:600 1.5vh/1 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;margin:0;color:#bfe3de}
.wt b{font:600 4.6vh/1.2 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.wt span{font-size:2.6vh;color:#e1f3f0;font-variant-numeric:tabular-nums}
.wt small{font-size:2.2vh;color:#b9dad6;font-variant-numeric:tabular-nums}
.bar{display:block;position:relative;width:min(420px,40vw);height:.7vh;min-height:4px;margin:.6vh 0;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;border-radius:3px;background:#f4eee3;animation:sl 1.4s ease-in-out infinite}
@keyframes sl{0%{left:-40%}100%{left:100%}}

/* ===== Refonte visuelle : titre en serif doré, fond sombre sous le texte ===== */
.wt{padding:10vh 5vw 5vh;gap:1.1vh;background:linear-gradient(transparent,rgba(2,22,26,.92) 45%)}
.wt h1{font:600 4.6vh/1.1 "Iowan Old Style","Palatino Linotype",Constantia,Cambria,Georgia,serif;letter-spacing:.01em;text-transform:none;color:#e8c47a}
.wt h1::after{content:"";display:block;width:9vh;height:2px;margin:1.6vh auto .6vh;background:#e8c47a;opacity:.7}
.wt b{font-size:3.2vh;font-weight:500;color:#f3ecd9;text-shadow:none}
.wt span{color:#cfe6e2}
#msg{background:rgba(176,46,40,.94);border-top:2px solid #ffb3ac}
</style>
<video id="v" autoplay playsinline></video>
<div id="w"><video id="wv" muted loop playsinline autoplay preload="auto"><source src="attente.webm" type="video/webm"><source src="attente.mp4" type="video/mp4"></video>
  <div class="wt"><h1>Tabernacle La Parole Révélée</h1><b id="wtt">En attente de la caméra</b><span id="wtd"></span><i class="bar"></i><small id="wts"></small></div></div>
<div id="dbg"></div><div id="msg"></div>
<script>
const P=new URLSearchParams(location.search),room=P.get('room')||'main';
/* Tampon anti-saccades (ms). 0 = latence minimale mais l'image saccade au moindre aléa du Wi-Fi.
   250 ms par défaut : en situation réelle (Wi-Fi chargé) 100 ms était trop juste. Modifiable : obs.html?delay=150 (plus réactif) ou ?delay=400 (plus fluide).
   ?vol=0.6 : volume du son reçu (0 à 1, 1 par défaut).
   ?code=123456 : seulement si cette page tourne sur un autre appareil que le PC (le PC lui-même n'a pas besoin de code). */
const DELAY=Math.max(0,+(P.get('delay')||250)),CODE=P.get('code')||'',VOL=P.has('vol')?Math.min(1,Math.max(0,+P.get('vol')||0)):1;
v.volume=VOL;
const MYID=Math.random().toString(36).slice(2)+Date.now().toString(36);   /* identifie cette page : un rechargement n'est pas un « autre appareil » */
const note=t=>{msg.textContent=t;msg.style.display=t?'block':'none'};
let ws,pc,q=Promise.resolve(),prev;
const sj=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
const isLive=()=>!!pc&&pc.connectionState==='connected';
/* « À l'antenne » = la source est visible dans le PROGRAMME d'OBS (pas seulement dans l'aperçu) et l'image est reçue.
   OBS prévient la page par obsSourceActiveChanged. Tant qu'OBS n'a rien dit, on suppose « active » : mieux vaut
   afficher « à l'antenne » à tort que cacher à quelqu'un qu'il est diffusé. */
let srcActive=true;
const isOnAir=()=>isLive()&&srcActive;
const air=()=>sj({type:'onair',value:isOnAir()});
const act=()=>{sj({type:'active',value:isLive()});air()};
window.addEventListener('obsSourceActiveChanged',e=>{srcActive=!!(e.detail&&e.detail.active);air()});
try{if(window.obsstudio)window.obsstudio.onActiveChange=a=>{srcActive=!!a;air()}}catch{}

/* ───── Écran d'attente ───── */
const camName=room==='main'?'la caméra':'la caméra '+room.replace(/^cam/,'');
let flowing=false,everFlowed=false,frozen=0,lastN=0,wmode=null,since=Date.now(),hideT;
const resetFlow=()=>{flowing=false;everFlowed=false;frozen=0;lastN=0;prev=null};
function wstate(){
  if(!pc)return 'wait';
  if(pc.connectionState!=='connected')return 'connect';
  return flowing?'':(everFlowed?'frozen':'load');
}
const pad=n=>String(n).padStart(2,'0');
function render(){
  const st=wstate();
  if(st!==wmode){
    wmode=st;since=Date.now();
    if(st){clearTimeout(hideT);w.classList.remove('hide');wv.play().catch(()=>{})}
    else{w.classList.add('hide');clearTimeout(hideT);hideT=setTimeout(()=>wv.pause(),500)}   /* on arrête la vidéo d'attente une fois l'image de la caméra visible */
  }
  if(!st)return;
  wtt.textContent={wait:'En attente de '+camName,connect:everFlowed?'Connexion perdue : reconnexion…':'Connexion de '+camName+'…',load:'Chargement de l\'image…',frozen:'Image interrompue : reprise en cours…'}[st];
  wtd.textContent=new Date().toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const s=Math.floor((Date.now()-since)/1000);
  wts.textContent=(st==='wait'?'Aucune image reçue':'En cours')+' depuis '+pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);
}
setInterval(render,500);render();

async function handle(m){
  if(m.type==='offer'){
    if(pc)pc.close();
    resetFlow();
    pc=new RTCPeerConnection({iceServers:[]});
    pc.onconnectionstatechange=()=>{act();render()};
    pc.ontrack=e=>{try{e.receiver.jitterBufferTarget=DELAY}catch{}try{e.receiver.playoutDelayHint=DELAY/1000}catch{}if(v.srcObject!==e.streams[0])v.srcObject=e.streams[0]};
    pc.onicecandidate=e=>e.candidate&&sj({type:'candidate',candidate:e.candidate});
    await pc.setRemoteDescription({type:'offer',sdp:m.sdp});
    const a=await pc.createAnswer();await pc.setLocalDescription(a);sj({type:'answer',sdp:a.sdp});
    render();
  }else if(m.type==='candidate'&&pc){pc.addIceCandidate(m.candidate).catch(()=>{});}
  else if(m.type==='publisher-left'){if(pc)pc.close();pc=null;v.srcObject=null;resetFlow();act();render()}
}
function connect(){
  const w=ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  w.onopen=()=>{note('');sj({type:'join',role:'viewer',room,active:isLive(),onair:isOnAir(),id:MYID,code:CODE})};
  w.onclose=e=>{
    if(w!==ws)return;                       /* ancienne connexion : la nouvelle est déjà en place */
    if(e.code===4000)return;                /* remplacée par cette même page : ne pas se reconnecter */
    if(e.code===4001){note('TPR Live : cette caméra est déjà reçue par une autre source OBS ou un autre onglet. Fermez l\'autre.');return setTimeout(connect,3000)}   /* le nouveau venu attend, il ne chasse personne */
    if(e.code===4003){note('TPR Live : code d\'appairage manquant ou incorrect (adresse ?code=… dans la fenêtre TPR Live).');return setTimeout(connect,10000)}
    setTimeout(connect,1000)};
  w.onmessage=e=>{q=q.then(()=>handle(JSON.parse(e.data))).catch(console.error)};
}
connect();
/* Mesures de réception : toujours envoyées au PC (fenêtre TPR Live) ; affichées dans OBS seulement avec ?debug=1 */
if(P.get('debug'))dbg.style.display='block';
setInterval(async()=>{
  if(!pc||pc.connectionState!=='connected')return;let i;(await pc.getStats()).forEach(x=>{if(x.type==='inbound-rtp'&&x.kind==='video')i=x});
  if(!i){if(P.get('debug'))dbg.textContent='Aucune vidéo reçue';return}
  /* l'image avance-t-elle ? (images décodées en plus depuis la dernière seconde) */
  const n=i.framesDecoded||0;
  if(n>lastN){flowing=true;everFlowed=true;frozen=0}else if(++frozen>=2)flowing=false;
  lastN=n;
  const dropped=prev?i.framesDropped-prev.framesDropped:0,lost=prev?i.packetsLost-prev.packetsLost:0,
  jb=i.jitterBufferEmittedCount?Math.round(i.jitterBufferDelay/i.jitterBufferEmittedCount*1000):0,jit=Math.round((i.jitter||0)*1000),fps=Math.round(i.framesPerSecond||0);
  sj({type:'vstats',res:(i.frameWidth||0)+'×'+(i.frameHeight||0),fps,dropped,lost,jitter:jit,buf:jb});
  if(P.get('debug'))dbg.textContent='Reçu : '+i.frameWidth+'x'+i.frameHeight+' à '+fps+' i/s\nImages perdues par OBS : '+dropped+' /s\nPaquets perdus : '+i.packetsLost+'\nTampon : '+jb+' ms   Gigue : '+jit+' ms';
  prev=i;render()},1000);
</script>
