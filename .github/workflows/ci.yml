name: Tests
on:
  pull_request:
  push:
    branches-ignore: [main]   # sur main, release.yml lance déjà les tests avant de publier
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
