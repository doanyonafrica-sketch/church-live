name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build et publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir desktop/server && cp server/server.js desktop/server/ && cp -r server/public desktop/server/
          cd desktop && npm install
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npx electron-builder --win --publish always
  apk:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          mkdir -p mobile/www && cp server/public/phone.html mobile/www/index.html
          sed -i "s/const VERSION='dev'/const VERSION='${GITHUB_REF_NAME#v}'/" mobile/www/index.html
          cd mobile
          npm install
          npx cap add android
          cp -r icons/res/. android/app/src/main/res/
          sed -i 's#<activity #<activity android:screenOrientation="sensorLandscape" #' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../church-live.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: church-live.apk
